<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | ScopeDeals</title>
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Navbar Component -->
    <div id="navbar-app"></div>

    <header class="hero" style="height: 50vh; min-height: 400px; padding-top: 100px;">
        <div class="video-background">
            <div class="video-overlay"
                style="background: linear-gradient(135deg, #111, var(--color-primary)); opacity: 0.9;"></div>
        </div>
        <div class="container hero-content">
            <h1 class="hero-title" data-i18n="contact.title">Get in Touch</h1>
            <p class="hero-subtitle" data-i18n="contact.subtitle">Ready to book a service? We're here to help.</p>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <div class="contact-wrapper">
                <div class="contact-info" style="text-align: center; margin-bottom: 2rem;">
                    <p style="font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--color-text);">
                        <strong data-i18n="form.phone">Phone:</strong> <a href="tel:+96891978441"
                            style="color: var(--color-primary); font-weight: 700;">+968 9197 8441</a>
                    </p>
                    <p style="font-size: 1.2rem; color: var(--color-text);">
                        <strong data-i18n="form.email">Email:</strong> <a href="mailto:aliambrose25@gmail.com"
                            style="color: var(--color-primary); font-weight: 700;">aliambrose25@gmail.com</a>
                    </p>
                </div>

                <form class="contact-form" id="bookingForm">
                    <div class="form-group">
                        <label for="name" data-i18n="form.name">Name</label>
                        <input type="text" id="name" name="name" required placeholder="Your Name"
                            data-i18n-placeholder="form.name">
                    </div>
                    <div class="form-group">
                        <label for="phone" data-i18n="form.phone">Phone</label>
                        <input type="tel" id="phone" name="phone" required placeholder="Your Phone Number"
                            data-i18n-placeholder="form.phone">
                    </div>
                    <div class="form-group">
                        <label for="email" data-i18n="form.email">Email (Optional)</label>
                        <input type="email" id="email" name="email" placeholder="Your Email Address"
                            data-i18n-placeholder="form.email">
                    </div>
                    <div class="form-group">
                        <label for="service" data-i18n="form.service">Service</label>
                        <select id="service" name="service">
                            <option data-i18n="services.ac.title">AC Repair</option>
                            <option data-i18n="services.fridge.title">Fridge Repair</option>
                            <option data-i18n="services.carpet.title">Carpet & Sofa Cleaning</option>
                            <option data-i18n="services.curtain.title">Curtain Cleaning</option>
                            <option data-i18n="form.other_service">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="country" data-i18n="form.country">Country</label>
                        <select id="country" name="country">
                            <option data-i18n="countries.uae">UAE</option>
                            <option data-i18n="countries.oman">Oman</option>
                            <option data-i18n="countries.qatar">Qatar</option>
                            <option data-i18n="countries.bahrain">Bahrain</option>
                            <option>Nigeria</option>
                            <option>India</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message" data-i18n="form.message">Message</label>
                        <textarea id="message" name="message" rows="4" placeholder="Any specific details?"
                            data-i18n-placeholder="form.message.placeholder"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;"
                        data-i18n="form.book_appointment">
                        Book Appointment
                    </button>
                    <button type="button" class="btn btn-block whatsapp-btn"
                        style="margin-top: 15px; background-color: #25D366; color: white; border: none; width: 100%;">
                        <i class="fab fa-whatsapp"></i> <span data-i18n="form.whatsapp">Book via WhatsApp</span>
                    </button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer Component -->
    <div id="footer-app"></div>

    <!-- Scripts -->
    <script src="js/translations.js"></script>
    <script src="js/localization.js"></script>
    <script src="js/components.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/analytics.js?v=2.0"></script>
</body>

</html>
