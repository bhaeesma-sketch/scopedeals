<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | ScopeDeals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar" style="background: transparent; box-shadow: none;">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="assets/logo.jpg" alt="ScopeDeals">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Login</a></li>
            </ul>
        </div>
    </nav>

    <div class="auth-split-container">
        <!-- Left Panel -->
        <div class="auth-left-panel" style="background-image: url('assets/fridge-repair.png');">
            <div class="auth-left-content">
                <h1>Password Recovery</h1>
                <p>We'll help you get back on track.</p>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="auth-right-panel">
            <div class="auth-form-container">
                <div class="auth-header">
                    <h2>Reset Password</h2>
                    <p>Enter your email and we'll send you a reset link</p>
                </div>

                <form id="forgotPasswordForm" class="auth-form">
                    <div class="form-group">
                        <label for="resetEmail">Email Address</label>
                        <input type="email" id="resetEmail" required placeholder="name@example.com">
                    </div>
                    <button type="submit" class="auth-button btn-primary btn-block" id="resetBtn">Send Reset
                        Link</button>
                </form>

                <p class="auth-footer" style="text-align: center;">
                    Remember your password? <a href="index.html">Login</a>
                </p>
                <div id="resetMessage" style="margin-top: 1rem; padding: 1rem; border-radius: 8px; display: none;">
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
