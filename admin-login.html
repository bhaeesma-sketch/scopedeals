<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | ScopeDeals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <nav class="navbar" style="background: transparent; box-shadow: none;">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="assets/logo.jpg" alt="ScopeDeals">
            </a>
            <ul class="nav-links"></ul>
        </div>
    </nav>

    <div class="auth-split-container">
        <!-- Left Panel -->
        <div class="auth-left-panel" style="background-image: url('assets/ac-repair.png');">
            <div class="auth-left-content">
                <h1>Welcome Back!</h1>
                <p>Manage your home service bookings with ease.</p>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="auth-right-panel">
            <div class="auth-form-container">
                <div class="auth-header">
                    <h2>Admin Access</h2>
                    <p>Enter your PIN code to unlock.</p>
                </div>

                <form id="pinForm" class="auth-form">
                    <!-- PIN Input -->
                    <div class="pin-display-container" style="text-align: center; margin-bottom: 2rem;">
                        <input type="password" id="pinInput" placeholder="PIN"
                            style="font-size: 2.5rem; letter-spacing: 0.8rem; text-align: center; width: 100%; padding: 10px; background: transparent; border: none; border-bottom: 2px solid var(--color-primary); color: #333;"
                            maxlength="4" inputmode="numeric" autofocus autocomplete="off">
                    </div>

                    <button type="submit" class="auth-button btn-primary btn-block" id="loginBtn">Unlock</button>

                    <p style="text-align: center; margin-top: 1rem; color: #6c757d; font-size: 0.8rem;">
                        Default Access PIN: <b>8888</b>
                    </p>
                </form>

            </div>
        </div>
    </div>

    <!-- Removed module imports that are not needed for PIN access logic -->
    <script type="module" src="js/main.js"></script>
    <script type="module">
        // PIN Logic
        const PIN_CODE = "8888"; // Set your desired PIN here

        const pinForm = document.getElementById('pinForm');
        const pinInput = document.getElementById('pinInput');
        const btn = document.getElementById('loginBtn');

        // Auto-focus and auto-submit on 4 digits
        if (pinInput) {
            pinInput.focus();
            pinInput.addEventListener('input', (e) => {
                if (e.target.value.length === 4) {
                    attemptLogin();
                }
            });
        }

        if (pinForm) {
            pinForm.addEventListener('submit', (e) => {
                e.preventDefault();
                attemptLogin();
            });
        }

        function attemptLogin() {
            const enteredPin = pinInput.value;

            if (enteredPin === PIN_CODE) {
                // Success
                btn.innerText = "Accepted";
                btn.style.background = "#10b981"; // Green

                // Set Session Token
                sessionStorage.setItem('scope_admin_access', 'true');

                // Redirect
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 500);
            } else {
                // Fail
                pinInput.value = "";
                btn.innerText = "Wrong PIN";
                btn.style.background = "#ef4444"; // Red

                setTimeout(() => {
                    btn.innerText = "Unlock";
                    btn.style.background = ""; // Reset
                }, 1000);
            }
        }
    </script>
</body>

</html>
